{{- if .Values.webhook.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8gb-ui.fullname" . }}-webhook
  labels: {{- include "k8gb-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.webhook.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: webhook}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: webhook}
    spec:
      serviceAccountName: {{ include "k8gb-ui.webhookSA" . }}
      securityContext: {{- include "k8gb-ui.podSecurity" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: webhook
          image: {{ printf "%s:%s" .Values.webhook.image.repository .Values.webhook.image.tag | quote }}
          imagePullPolicy: {{ .Values.webhook.image.pullPolicy }}
          args:
            - --listen=:8443
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --reconcile
            - --reconcile-interval={{ .Values.webhook.reconcileInterval }}
            - --allowed-namespaces={{ join "," .Values.webhook.namespaces }}
            - --allowed-geo-tags={{ join "," .Values.webhook.geoTags }}
            - --domains={{ join "," .Values.traefik.domains }}
            - --ingress-class={{ .Values.traefik.ingressClass }}
            - --ordinary-entrypoints={{ join "," .Values.traefik.ordinaryEntrypoints }}
            - --mtls-entrypoints={{ join "," .Values.traefik.mtlsEntrypoints }}
            - --tls-option-namespaces={{ join "," .Values.traefik.tlsOptionNamespaces }}
            - --cn-plugin={{ .Values.traefik.certauthzAlias }}
          ports: [{name: https, containerPort: 8443}]
          readinessProbe: {httpGet: {path: /readyz, port: https, scheme: HTTPS}}
          livenessProbe: {httpGet: {path: /healthz, port: https, scheme: HTTPS}}
          securityContext: {{- include "k8gb-ui.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.webhook.resources | nindent 12 }}
          volumeMounts: [{name: tls, mountPath: /tls, readOnly: true}]
      volumes:
        - name: tls
          secret: {secretName: {{ .Values.webhook.tlsSecretName }}, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8gb-ui.fullname" . }}-webhook
  labels: {{- include "k8gb-ui.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: webhook}
  ports: [{name: https, port: 443, targetPort: https}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "k8gb-ui.webhookName" . }}
  labels: {{- include "k8gb-ui.labels" . | nindent 4 }}
webhooks:
  - name: ingressroutes.traefik.k8gb-ui.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 10
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: {{ .Values.webhook.namespaces | toJson }}
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "k8gb-ui.fullname" . }}-webhook
        port: 443
        path: /mutate
      caBundle: {{ .Values.webhook.caBundle | quote }}
    rules:
      - operations: [CREATE, UPDATE]
        apiGroups: [traefik.io, traefik.containo.us]
        apiVersions: [v1alpha1]
        resources: [ingressroutes]
        scope: Namespaced
{{- end }}
