name: Publish Helm chart

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-chart
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/ci.yaml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3
      - name: Check prerequisites and published images
        env:
          CHECK_PUBLISHED_IMAGES: "1"
          REQUIRE_UNPUBLISHED_CHART: "1"
        run: |
          test -s LICENSE
          git show-ref --verify refs/remotes/origin/gh-pages
          go test ./tests/helm -run TestReleaseImageDefaults -count=1 -v
      - name: Configure release identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          version: v1.7.0
          install_only: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Explicit packaging also handles the repository's very first commit.
      - name: Publish packages and merge the Pages index
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          cr package charts/k8gb-ui
          cr upload --owner "$owner" --git-repo "$repo" --commit "$GITHUB_SHA" --packages-with-index --pages-branch gh-pages --push --skip-existing
          cr index --owner "$owner" --git-repo "$repo" --packages-with-index --pages-branch gh-pages --index-path . --push
  pages:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gh-pages
          persist-credentials: false
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
