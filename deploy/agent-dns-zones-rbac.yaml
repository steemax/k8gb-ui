# Adjust the namespace and resourceName to the agent's --k8gb-* locator flags.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8gb-ui-controller-zones
  namespace: k8gb
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [k8gb]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8gb-ui-controller-zones
  namespace: k8gb
subjects:
  - kind: ServiceAccount
    name: k8gb-ui-agent
    namespace: k8gb-ui-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8gb-ui-controller-zones
