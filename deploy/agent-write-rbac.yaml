# Optional permissions. Do not install for read-only agents. For namespace-only
# installations, replace the ClusterRoleBinding with RoleBindings in each allowed NS.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8gb-ui-agent-writer
rules:
  - apiGroups: [k8gb.io, k8gb.absa.oss]
    resources: [gslbs]
    verbs: [get, create, patch]
  - apiGroups: [traefik.io, traefik.containo.us]
    resources: [ingressroutes]
    verbs: [get, list, patch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    resourceNames: [k8gb-ui-traefik]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8gb-ui-agent-writer
subjects:
  - kind: ServiceAccount
    name: k8gb-ui-agent
    namespace: k8gb-ui-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8gb-ui-agent-writer
