# Optional adapter example. Create the namespace and TLS Secret separately.
# Set the image and CA bundle before use. Opt in namespaces only after readiness.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8gb-ui-traefik
  namespace: k8gb-ui-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8gb-ui-traefik
  namespace: k8gb-ui-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8gb-ui-traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8gb-ui-traefik
    spec:
      serviceAccountName: k8gb-ui-traefik
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: steemax/k8gb-ui:0.1.0-webhook
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:8443
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --reconcile
            - --reconcile-interval=10s
            - --allowed-namespaces=demo
            - --allowed-geo-tags=east,west
            - --domain=apps.example.test
            - --ingress-class=traefik
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: k8gb-ui-traefik-tls
---
apiVersion: v1
kind: Service
metadata:
  name: k8gb-ui-traefik
  namespace: k8gb-ui-system
spec:
  selector:
    app.kubernetes.io/name: k8gb-ui-traefik
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: k8gb-ui-traefik
webhooks:
  - name: ingressroutes.traefik.k8gb-ui.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 10
    namespaceSelector:
      matchLabels:
        k8gb-ui.io/traefik-enabled: 'true'
    clientConfig:
      service:
        namespace: k8gb-ui-system
        name: k8gb-ui-traefik
        port: 443
        path: /mutate
      # Supply the base64 PEM of the issuer of the webhook server certificate.
      caBundle: ''
    rules:
      - operations: [CREATE, UPDATE]
        apiGroups: [traefik.io, traefik.containo.us]
        apiVersions: [v1alpha1]
        resources: [ingressroutes]
        scope: Namespaced
