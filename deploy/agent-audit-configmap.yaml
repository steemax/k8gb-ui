# Optional shared history. Replace app with each allowed application namespace.
# Install before enabling --audit-configmap=k8gb-ui-audit. This grants access to
# this one ConfigMap only, not create/list/delete access to other ConfigMaps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8gb-ui-audit
  namespace: app
  labels:
    k8gb-ui.io/audit-journal: 'true'
data: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8gb-ui-agent-audit
  namespace: app
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [k8gb-ui-audit]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8gb-ui-agent-audit
  namespace: app
subjects:
  - kind: ServiceAccount
    name: k8gb-ui-agent
    namespace: k8gb-ui-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8gb-ui-agent-audit
